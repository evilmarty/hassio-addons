schemaVersion: "2.0.0"

fileExistenceTests:
  - name: init
    path: /init
    shouldExist: true
    permissions: "-rwxr-xr-x"
    uid: 0
    gid: 0

commandTests:
  - name: persistent storage is writable by the non-root runtime
    command: node
    args:
      - -e
      - |
        const fs = require("node:fs");
        const { execFileSync } = require("node:child_process");
        fs.mkdirSync("/data", { recursive: true });
        fs.writeFileSync("/data/options.json", "{}");
        execFileSync("/init", ["node", "-e", `
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          assert.equal(process.getuid(), 999);
          assert.equal(process.getgid(), 999);
          assert.equal(process.env.LAYERLING_SHARED_PROJECTS_DIR, "/data/projects");
          assert.equal(process.env.LAYERLING_DEFAULT_THEME, "system");
          assert.equal(process.env.LAYERLING_SIMPLE_MODE, "false");
          assert.equal(process.env.LAYERLING_NEW_DESIGNS_ON_SERVER, "always");
          assert.equal(process.env.LAYERLING_MCP_REMOTE, undefined);
          fs.writeFileSync("/data/projects/storage-test", "project");
          fs.writeFileSync("/app/.codex/project-thumbnails/storage-test", "thumbnail");
          assert.equal(fs.readFileSync("/data/project-thumbnails/storage-test", "utf8"), "thumbnail");
          fs.unlinkSync("/data/projects/storage-test");
          fs.unlinkSync("/data/project-thumbnails/storage-test");
        `], { stdio: "inherit" });
    exitCode: 0
  - name: configuration maps to upstream environment variables
    command: node
    args:
      - -e
      - |
        const fs = require("node:fs");
        const { execFileSync } = require("node:child_process");
        fs.mkdirSync("/data", { recursive: true });
        fs.writeFileSync("/data/options.json", JSON.stringify({
          "default_theme": "graphite",
          "simple_mode": "always",
          "new_designs_on_server": "false",
          "allowed_origins": "https://cad.example.com,https://other.example.com",
          "user_header": "X-Forwarded-Email",
          "mcp_remote": true,
          "mcp_token": "test-token-with-\u0024-and-spaces '",
          "mcp_allowed_hosts": "cad.example.com,other.example.com"
        }));
        execFileSync("/init", ["node", "-e", `
          const assert = require("node:assert/strict");
          const options = require("/data/options.json");
          for (const [key, value] of Object.entries(options)) {
            assert.equal(process.env["LAYERLING_" + key.toUpperCase()], String(value));
          }
        `], { stdio: "inherit" });
    exitCode: 0
  - name: explicit false disables MCP remote access
    command: node
    args:
      - -e
      - |
        const fs = require("node:fs");
        const { execFileSync } = require("node:child_process");
        fs.mkdirSync("/data", { recursive: true });
        fs.writeFileSync("/data/options.json", '{"mcp_remote":false}');
        execFileSync("/init", ["node", "-e", `
          require("node:assert/strict").equal(process.env.LAYERLING_MCP_REMOTE, "false");
        `], { env: { ...process.env, LAYERLING_MCP_REMOTE: "true" }, stdio: "inherit" });
    exitCode: 0
  - name: MCP remote access rejects missing or short tokens
    command: node
    args:
      - -e
      - |
        const assert = require("node:assert/strict");
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");
        fs.mkdirSync("/data", { recursive: true });
        for (const options of [
          { mcp_remote: true },
          { mcp_remote: true, mcp_token: "                short                " }
        ]) {
          fs.writeFileSync("/data/options.json", JSON.stringify(options));
          const result = spawnSync("/init", ["true"], { encoding: "utf8" });
          assert.ifError(result.error);
          assert.equal(result.status, 1, "MCP startup must reject an invalid token");
          assert.match(result.stderr, /requires mcp_token/);
        }
    exitCode: 0

metadataTest:
  volumes: ["/data"]
  entrypoint: ["/init"]
  cmd: ["node", "node_modules/next/dist/bin/next", "start", "apps/web"]
